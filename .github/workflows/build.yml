name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: |
          bun install --frozen-lockfile
          cd app && bun install --frozen-lockfile

      - name: Test
        run: bun test

      - name: Build the app
        run: bun run build

      # Bun cross-compiles every target from this one runner.
      - name: Compile executables
        run: bun tools/build-exe.ts bun-linux-x64 bun-linux-arm64 bun-windows-x64

      - uses: actions/upload-artifact@v4
        with:
          name: spiderv-web-control-linux-x64
          path: dist-exe/spiderv-web-control-linux-x64
      - uses: actions/upload-artifact@v4
        with:
          name: spiderv-web-control-linux-arm64
          path: dist-exe/spiderv-web-control-linux-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: spiderv-web-control-windows-x64
          path: dist-exe/spiderv-web-control-windows-x64.exe

      # The app on its own for GitHub Pages: no relay server there, so the
      # build leaves out remote control. Installed on a phone, it works offline.
      - name: Build the app for GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: VITE_NO_RELAY=1 bun run build
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          path: app/dist

  pages:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist-exe
          merge-multiple: true
      - name: Attach executables to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
            || gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --generate-notes
          gh release upload "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --clobber dist-exe/*
