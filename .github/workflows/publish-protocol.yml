name: Publish spiderv-protocol

# Tag a release as spiderv-protocol-v<version> (matching packages/spiderv/package.json).
# Needs an NPM_TOKEN secret (an npm automation token).
on:
  push:
    tags: ['spiderv-protocol-v*']

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: bun install --frozen-lockfile
      - run: bun test

      - name: Check the tag matches the version
        run: |
          v=$(node -p "require('./packages/spiderv/package.json').version")
          [ "$GITHUB_REF_NAME" = "spiderv-protocol-v$v" ] || { echo "tag $GITHUB_REF_NAME does not match version $v"; exit 1; }

      - run: bun run build:lib
      - run: npm publish ./dist --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
